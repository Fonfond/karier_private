# nginx для веб-контейнера «Карьер».
# Монтируется в /etc/nginx/conf.d/default.conf (см. docker-compose.yml, сервис web).
# Раздаёт собранный SPA из /usr/share/nginx/html и проксирует /api на контейнер api.

# gzip-настройки (уровень http: conf.d включается внутрь http)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # security-заголовки для статики (API отдаёт свои)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # sourcemap в прод не отдаём
    location ~* \.map$ {
        return 404;
    }

    # API: проксируем на внутренний сервис api (порт 8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # размер загружаемых документов/фото (MAX_DOCUMENT_MB/MAX_PHOTO_MB в API)
        client_max_body_size 25m;
    }

    # статика с хешем в имени — долгий кэш
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html и service worker не кэшируем, чтобы обновления доезжали сразу
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
