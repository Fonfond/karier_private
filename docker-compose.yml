# Docker Compose для «Карьер»: PostgreSQL 18 + API (1 воркер) + nginx со статикой.
#
# Быстрый старт (на машине с Docker):
#   cp .env.example .env        # заполнить POSTGRES_PASSWORD и SECRET_KEY
#   docker compose up -d --build
#   открыть http://127.0.0.1:8080   (health: /api/health/ready)
#
# Секретов в этом файле нет: всё, что чувствительно, приходит из .env (в git не коммитится).

name: karier

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karier_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-karier_db}
      # стабильная локаль для сортировок/отчётов
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql
    # Порт наружу не публикуем: база доступна только контейнерам compose.
    # Для отладки можно раскомментировать: ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри сети compose БД доступна по имени сервиса; пароль — только из .env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-karier_user}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-karier_db}
      ENV: ${ENV:-prod}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # один воркер: rate-limit и часть состояния живут в памяти процесса
      API_WORKERS: ${API_WORKERS:-1}
      DOCUMENTS_DIR: var/documents
      MEDIA_DIR: var/media
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      # постоянные данные приложения (переживают down/up и пересборку образа)
      - documents:/app/var/documents
      - media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
    # entrypoint ждёт БД, применяет alembic upgrade head и стартует uvicorn
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 20s

  web:
    build:
      context: ./src-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # конфиг nginx живёт в репозитории и монтируется в контейнер
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  documents:
  media:
