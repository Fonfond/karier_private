[pytest]
; Конфигурация pytest для backend-v2 (S-3).
; Задачи:
;   * --strict-markers: опечатка в маркере — ошибка, а не «тихо пропустили тест»;
;   * --strict-config: неизвестный ключ/секция конфига — ошибка, а не игнорирование;
;   * --durations=20: видно самые медленные тесты (полный прогон ~7-8 минут, реально
;     дорогие места — сброс схемы в heal_topology и PDF/XLSX-экспорт);
;   * маркеры slow/integration объявлены заранее, чтобы их можно было ставить
;     по мере разгребания S-9 (изоляция тестов) и S-10 (дрейф моделей).

testpaths = tests

addopts =
    --strict-markers
    --strict-config
    --durations=20

markers =
    slow: долгая проверка (> 30 с); такие тесты можно вынести из быстрого локального прогона
    integration: тест требует внешних данных или сервисов (демо-дамп, подложка карты, файлы хранилища) и в CI без фикстур может быть пропущен
